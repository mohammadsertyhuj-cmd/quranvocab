name: Build APK v2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create app icon
        run: |
          python -m pip install pillow
          python - <<'PY'
          import math
          from PIL import Image, ImageDraw
          s = 512
          navy = (4, 9, 18)
          gold = (224, 166, 77)
          img = Image.new("RGB", (s, s), navy)
          d = ImageDraw.Draw(img)
          d.ellipse((90, 100, 410, 420), fill=gold)
          d.ellipse((150, 80, 450, 380), fill=navy)
          cx, cy, R, r = 345, 215, 38, 15
          pts = []
          for i in range(10):
              a = -math.pi / 2 + i * math.pi / 5
              rad = R if i % 2 == 0 else r
              pts.append((cx + rad * math.cos(a), cy + rad * math.sin(a)))
          d.polygon(pts, fill=gold)
          img.save("icon.png")
          PY
          ls -l icon.png

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.37 virtualenv setuptools==69.5.1

      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          python -m pip install cython==0.29.37
          which cython
          cython --version
          n=0
          until buildozer -v android debug; do
            n=$((n+1))
            if [ "$n" -ge 2 ]; then
              echo "Build failed twice"
              exit 1
            fi
            echo "Retrying build..."
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quranvocab-apk
          path: bin/*.apk
          if-no-files-found: error
